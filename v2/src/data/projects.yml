# Projects: named software/frameworks and the industry case-study portfolio.
# Migrated from v1 projects.html. `kind: software` = a tool or framework that
# still has a home page or repo; `kind: case-study` = applied work for a partner.
# `papers` is intentionally left empty everywhere: publication ids are not
# guessed here, they should be linked by hand once publications.yml is settled.

# ---------------------------------------------------------------------------
# Software
# ---------------------------------------------------------------------------

- id: scar
  title: ScaR
  summary: >-
    A real-time recommender framework built as independent microservices over
    Apache Solr, so new user events could influence recommendations within
    seconds instead of waiting for a batch rebuild.
  detail: >-
    Offered as Recommendation-as-a-Service and used as the recommendation
    backend across several of the industry case studies below. Scalability was
    measured on a Foursquare benchmark, where distributing microservice
    replicas across two servers raised throughput by up to 83% while keeping
    response times under 200 ms.
  kind: software
  url: "http://scar.know-center.tugraz.at/"
  papers: []
  featured: false

- id: tagrec
  title: TagRec
  summary: >-
    An open-source Java framework for tag-recommender research that put over 30
    algorithms behind one shared evaluation pipeline so published results could
    actually be reproduced.
  detail: >-
    Covers classic approaches such as FolkRank and tensor factorisation
    alongside models grounded in cognitive psychology (ACT-R, MINERVA2).
    Developed within the EU Learning Layers project.
  kind: software
  repo: "https://github.com/learning-layers/TagRec"
  papers: []
  featured: false

