# ---------------------------------------------------------------------------
# Case studies
# ---------------------------------------------------------------------------

- id: job-marketplace
  title: Job Marketplace
  summary: >-
    A matchmaking engine for Talto, the student and graduate job marketplace
    attached to the Studo student app, pairing candidates with job postings.
  detail: >-
    Raised overall engagement with the marketplace by roughly 20% and the
    application rate on posted jobs by roughly 18%. Added personalisation for
    anonymous users and extended it beyond jobs to related content such as news
    articles, alongside new research on matchmaking in student job markets.
  kind: case-study
  partner: Moshbit GmbH (Studo, Talto)
  url: "https://talto.com/"
  image: /images/apps/studo_jobs3.png
  papers: []
  featured: true

- id: steerable-guest-activities
  title: Steerable Guest Activities
  summary: >-
    A context-aware recommender that predicted a guest's interest in organised
    holiday activities, letting the municipality of Schladming even out guest
    throughput by promoting or temporarily hiding particular activities.
  detail: >-
    Guest profiles were inferred from anonymised Schladming-Dachstein Sommercard
    data. Recommendations took the activity itself, weather, location, category,
    a defined time frame and optional boosting settings into account.
  kind: case-study
  partner: Municipality of Schladming (Schladming-Dachstein)
  url: "https://www.schladming-dachstein.at/de/sommercard"
  image: /images/apps/schladming-recomm_shadow.png
  papers: []
  featured: true

- id: personalized-culture-events
  title: Personalized Culture Events
  summary: >-
    An analysis of visitor and ticketing data across the Graz theatre venues,
    turned into personalisation concepts for both anonymous and known customers.
  detail: >-
    Theaterholding Graz registers around 500,000 visitors a year across the Graz
    Opera, Schauspielhaus, Next Liberty, the Kasematten, the Orpheum and Dom im
    Berg. The work covered customer behaviour such as pricing and preferences,
    then developed use cases and design concepts for personalised cultural
    event offers.
  kind: case-study
  partner: Theaterholding Graz
  url: "https://www.theaterholding.at/"
  image: /images/apps/theaterholding.png
  papers: []
  featured: true

- id: social-book-recommender
  title: Social Book Recommender
  summary: >-
    A recommender for the ZBW book rental platform that combined rental records
    with social network signals between users to surface relevant books.
  detail: >-
    Aimed at reducing information overload on a dual-platform rental service.
    Paired with a bubble visualisation that made browsing and exploring the
    catalogue easier.
  kind: case-study
  partner: "ZBW - Leibniz-Informationszentrum Wirtschaft"
  url: "http://www.zbw.eu/de/"
  image: /images/apps/ZBW.png
  papers: []
  featured: true

- id: project-partner-matchmaker
  title: Project Partner Matchmaker
  summary: >-
    A service that linked scientific institutions looking to form consortia with
    partners holding the right disciplinary strengths, using the OpenAIRE
    scholarly graph.
  detail: >-
    Draws on records of institutions, projects and funders so organisations can
    search for partners with a strong track record of funding success, which
    also increases the added-value potential of the OpenAIRE graph itself.
  kind: case-study
  partner: OpenAIRE
  url: "https://www.openaire.eu/"
  image: /images/apps/openaire.png
  papers: []
  featured: true

- id: social-care-support-system
  title: Social Care Support System
  summary: >-
    An anonymous, problem-aware ticketing system that routed clients of social
    care organisations to the counsellor best suited to their situation.
  detail: >-
    Built for social care organisations serving clients such as asylum seekers
    and victims of domestic violence. It also lowered counsellor workload by
    suggesting possible answers and related resources for a client's problem.
  kind: case-study
  partner: Nekom
  url: "https://nekom.com"
  image: /images/apps/srs_nekom2.png
  papers: []
  featured: false

- id: conference-assistant
  title: Conference Assistant
  summary: >-
    A personalisation layer inside the i-KNOW conference mobile app that
    reminded attendees about talks matching their interests and matched
    attendees to each other.
  detail: >-
    The app itself gave fast access to the schedule, session room locations,
    speaker information and talk details. Attendee-to-attendee matching was
    based on shared interests and collaboration potential.
  kind: case-study
  partner: "Know-Center (i-KNOW conference)"
  url: "https://i-know.know-center.tugraz.at/"
  image: /images/apps/conference_assistent.png
  papers: []
  featured: false

- id: biomedical-playlist-generator
  title: Biomedical Playlist Generator
  summary: >-
    An automatic playlist generator for people living with dementia that used
    wearable sensor data to detect emotional response and pick songs that
    provoked a positive reaction.
  detail: >-
    Built on the observation that people with dementia still respond to music
    they like. The research side looked at algorithms that uncover emotional
    reaction to a song from wearable device data, feeding a sensor-based system
    that stimulates the brain through music.
  kind: case-study
  partner: MechaMed
  url: "http://www.mechamed.com/"
  image: /images/apps/music_rec.png
  papers: []
  featured: false

- id: brokerage
  title: Brokerage
  summary: >-
    A brokerage system for the Data Market Austria platform that connected
    buyers and suppliers of datasets, data services, consulting and
    infrastructure across industry and research domains.
  detail: >-
    Included an extensive analysis and conception phase covering the Austrian
    data market landscape. The brokerage itself was aimed at the information
    overload problem participants faced when looking for clients or suppliers.
  kind: case-study
  partner: Data Market Austria (DMA)
  url: "https://datamarket.at/en/"
  image: /images/apps/dma_struct.png
  papers: []
  featured: true

- id: learning-resources
  title: Learning Resources
  summary: >-
    A recommender for social learning platforms that suggested learning
    resources both from user interactions and from the tags learners applied.
  detail: >-
    Built on the ScaR framework for the AFEL project and evaluated on data from
    Didactalia, a large Spanish social learning platform, where tag-based
    collaborative filtering beat interaction-based filtering on both accuracy
    and user coverage. The v1 section for this case study was commented out and
    empty; this description is reconstructed from the AFEL-REC paper the image
    filename points to, so please confirm it.
  kind: case-study
  partner: AFEL project (Didactalia)
  image: /images/apps/afel.png
  papers: []
  featured: false

- id: hotel-booking
  title: Hotel Booking
  summary: >-
    A real-time hotel recommender for the TripRebel booking portal that combined
    a traveller's implicit preferences with the hotel they were currently
    viewing.
  detail: >-
    Built on Apache Solr over the Expedia Affiliate Network catalogue, with
    content-based, user-based collaborative and hybrid strategies. The
    context-aware collaborative variant reached a 4.3% conversion rate, roughly
    double the baseline. The v1 section for this case study was commented out
    and empty; this description is reconstructed from the i-KNOW 2015 TripRebel
    paper, so please confirm it.
  kind: case-study
  partner: TripRebel
  image: /images/apps/triprebel.png
  papers: []
  featured: false

- id: tag-recommender-e-books
  title: Tag Recommender for E-Books
  summary: >-
    A tag recommender for e-book annotation that blended editor-assigned tags
    with Amazon user search terms to close the gap between how editors describe
    books and how readers look for them.
  detail: >-
    Nineteen algorithms were compared not only on accuracy but on semantic
    similarity to readers' review vocabulary and on tag diversity; hybrids of
    popularity- and similarity-based methods performed best across all three.
    The v1 section for this case study was commented out and empty; this
    description is reconstructed from the RecSys 2019 paper, so please confirm
    it.
  kind: case-study
  image: /images/apps/hgv_v2.png
  papers: []
  featured: false

