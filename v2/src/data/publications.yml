# Publications — the single source of truth for every paper on this site.
#
# The publication list, the per-paper pages, the "selected work" section on the
# landing page, and the generated BibTeX and APA citation strings all read from
# this file. Nothing about a paper is stored anywhere else, so a record here can
# never disagree with what a visitor sees or copies.
#
# Validated at build time by the `publications` collection in
# src/content.config.ts. `id` is the stable slug other collections reference
# (paper-notes frontmatter, project entries), so treat it as permanent: changing
# an id breaks those references and the paper's URL.
#
# Conventions:
#   id        <year>-<venue-short-lowercase>-<one-or-two-keywords>
#   authors   publication order, "Surname, I." form
#   pdf/poster site-absolute paths under /documents/
#   selected  exactly five papers, ranked 1-5
#   areas     open topic tags (kebab-case); prefer reusing existing ones
#   air       true for Team AIR / Infobip research outcomes

